name: CI

on: [push]
jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cypress Tests 🧪
        uses: cypress-io/github-action@v5
        with:
          start: "npm run dev"
          build: "npm run build"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cypress Results
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
          if-no-files-found: ignore
